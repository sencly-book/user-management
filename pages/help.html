<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>帮助中心</title></head>
<body style="padding:20px;font-family:sans-serif;">
<h1>📖 帮助中心</h1>
<p>欢迎使用用户管理系统！以下是常见功能介绍：</p>

<h2>🔑 登录</h2>
<p>使用用户名和密码登录系统。默认管理员账号：admin。</p>

<h2>📝 注册</h2>
<p>新用户可自行注册账号。</p>

<h2>🔍 搜索用户</h2>
<p>在搜索框中输入用户名或邮箱，即可查找已注册的用户。</p>

<h2>👤 个人中心</h2>
<p>查看自己的资料和余额，也可进行充值操作。</p>

<h2>📤 上传头像</h2>
<p>上传图片作为个人头像（仅支持 PNG、JPG、GIF、WebP 格式）。</p>

<h2>💰 充值</h2>
<p>在个人中心页面输入金额进行充值。单次充值上限为 10000，余额不可为负数。</p>

<hr>
<p style="color:#999;font-size:12px;">用户管理系统 v1.0 | 如有问题请联系管理员</p>
</body>
</html>
