{% extends "base.html" %}
{% block title %}上传头像 - 用户管理系统{% endblock %}
{% block content %}
<div class="card login-card">
    <h2>上传头像</h2>
    <form method="post" action="/upload" enctype="multipart/form-data">
        <div class="form-group">
            <label for="file">选择图片文件</label>
            <input type="file" id="file" name="file" class="form-input file-input" required>
        </div>
        <button type="submit" class="btn btn-primary">上传</button>
    </form>

    {% if error %}
    <div class="error-message">{{ error }}</div>
    {% endif %}

    {% if file_url %}
    <div class="upload-success">
        <h3>上传成功</h3>
        <div class="preview-container">
            <img src="{{ file_url }}" alt="头像预览" class="avatar-preview">
        </div>
        <p class="file-link">文件路径：<a href="{{ file_url }}" target="_blank">{{ file_url }}</a></p>
    </div>
    {% endif %}
</div>
{% endblock %}
