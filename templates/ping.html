{% extends "base.html" %}
{% block title %}Ping测试 - 用户管理系统{% endblock %}
{% block content %}
<div class="card">
    <h2>🌐 Ping 网络诊断</h2>
    <form method="post" action="/ping" class="search-form">
        <input type="text" name="ip" class="form-input search-input" placeholder="输入 IP 地址或域名，如 8.8.8.8" required>
        <button type="submit" class="btn btn-primary search-btn">Ping</button>
    </form>

    {% if result is not none %}
    <div class="ping-output">
        <h3>执行结果</h3>
        <pre class="ping-console">{{ result }}</pre>
    </div>
    {% endif %}
</div>
{% endblock %}
