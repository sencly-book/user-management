{% extends "base.html" %}
{% block title %}注册 - 用户管理系统{% endblock %}
{% block content %}
<div class="card login-card">
    <h2>用户注册</h2>
    <form method="post" action="/register">
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" class="form-input" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="请输入密码" required>
        </div>
        <div class="form-group">
            <label for="email">邮箱</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="请输入邮箱">
        </div>
        <div class="form-group">
            <label for="phone">手机号</label>
            <input type="text" id="phone" name="phone" class="form-input" placeholder="请输入手机号">
        </div>
        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}
        <button type="submit" class="btn btn-primary">注册</button>
    </form>
    <p class="login-hint">已有账号？<a href="/login">立即登录</a></p>
</div>
{% endblock %}
